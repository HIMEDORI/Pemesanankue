<style>


*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#f5f2fa;
  overflow-x:hidden;
}

/* NAVBAR */

.navbar{
  width:100%;
  padding:22px 8%;
  background:white;

  display:flex;
  justify-content:space-between;
  align-items:center;

  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.logo{
  font-size:40px;
  font-weight:700;
  color:#7d4cff;
}

.nav-links{
  display:flex;
  gap:35px;
  list-style:none;
}

.nav-links a{
  text-decoration:none;
  color:#444;
  font-size:20px;
  font-weight:500;
  transition:0.3s;
}

.nav-links a:hover{
  color:#7d4cff;
}

/* ABOUT */

.about{
  width:100%;
  padding:40px 8% 20px;

  display:flex;
  justify-content:center;
  align-items:center;
}

.about-content{

  width:100%;
  max-width:1200px;

  background:linear-gradient(
    135deg,
    #9b6dff,
    #7d4cff,
    #b48cff
  );

  padding:50px 50px;

  border-radius:35px;

  text-align:center;

  position:relative;

  overflow:hidden;

  box-shadow:
  0 15px 30px rgba(125,76,255,0.2);
}

/* BULAT */

.about-content::before{
  content:"";

  position:absolute;

  width:250px;
  height:250px;

  background:rgba(255,255,255,0.08);

  border-radius:50%;

  top:-100px;
  left:-100px;
}

.about-content::after{
  content:"";

  position:absolute;

  width:220px;
  height:220px;

  background:rgba(255,255,255,0.08);

  border-radius:50%;

  bottom:-100px;
  right:-100px;
}

/* MINI TEXT */

.mini-text{
  color:white;
  font-size:15px;
  letter-spacing:5px;
  margin-bottom:10px;
  text-transform:uppercase;
  position:relative;
  z-index:2;
}

/* JUDUL */

.about-content h1{

  font-size:70px;

  color:white;

  margin-bottom:20px;

  position:relative;

  z-index:2;

  text-shadow:
  0 5px 15px rgba(0,0,0,0.15);
}

/* TEXT */

.about-content p{

  color:white;

  font-size:22px;

  line-height:42px;

  font-weight:300;

  max-width:850px;

  margin:auto;

  position:relative;

  z-index:2;
}

/* SLIDER BOX */

.slider-box{

  width:92%;

  margin:18px auto;

  background:linear-gradient(
    135deg,
    #9b6dff,
    #7d4cff
  );

  border-radius:30px;

  padding:15px;

  overflow:hidden;

  box-shadow:
  0 10px 25px rgba(125,76,255,0.15);
}

/* TRACK */

.slider-track{
  display:flex;
  gap:15px;
  width:max-content;
}

/* IMAGE */

.slider-track img{

  width:180px;
  height:110px;

  object-fit:cover;

  border-radius:15px;

  flex-shrink:0;

  transition:0.3s;
}

.slider-track img:hover{
  transform:scale(1.05);
}

/* RESPONSIVE */

@media(max-width:900px){

  .logo{
    font-size:28px;
  }

  .nav-links{
    gap:20px;
  }

  .nav-links a{
    font-size:16px;
  }

  .about-content{
    padding:40px 25px;
  }

  .about-content h1{
    font-size:50px;
  }

  .about-content p{
    font-size:18px;
    line-height:35px;
  }

  .slider-track img{
    width:140px;
    height:90px;
  }

}

</style>

</head>

<script>

const slider1 =
document.getElementById("slider1");

const slider2 =
document.getElementById("slider2");

let posisi1 = 0;
let posisi2 = -1200;

function jalanSlider(){

  // atas ke kiri
  posisi1 -= 0.5;

  // bawah ke kanan
  posisi2 += 0.5;

  slider1.style.transform =
  `translateX(${posisi1}px)`;

  slider2.style.transform =
  `translateX(${posisi2}px)`;

  // reset atas
  if(posisi1 < -1400){
    posisi1 = 0;
  }

  // reset bawah
  if(posisi2 > 0){
    posisi2 = -1400;
  }

  requestAnimationFrame(jalanSlider);
}

jalanSlider();

</script>
